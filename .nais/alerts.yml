# The first two are nav-dekoratoren-api's alerts, for this app. The rest are for what this app can tell and that
# one couldn't: that Texas fails, and that users are without their name.
# No double curly braces in this file, not even in comments: nais deploy templates every resource with Handlebars.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nav-dekoratoren-auth-alerts
  namespace: navno
  labels:
    team: navno
spec:
  groups:
    - name: nav-dekoratoren-auth
      rules:
        - alert: NavDekoratorenAuthDown
          expr: kube_deployment_status_replicas_available{deployment="nav-dekoratoren-auth"} == 0
          for: 2m
          annotations:
            summary: nav-dekoratoren-auth has no pods running
            consequence: Dekoratøren shows every user as logged out, on every page that has it.
            action: Check the pods' logs and events with kubectl.
          labels:
            namespace: navno
            severity: danger
            receiver_reference: team-navno-backend-alerts
            alert_type: custom

        - alert: NavDekoratorenAuthLogErrors
          expr: (100 * sum by (log_app, log_namespace) (rate(log_messages_errors{app="nav-dekoratoren-auth",level=~"Warning|Error"}[3m])) / sum by (log_app, log_namespace) (rate(log_messages_total{app="nav-dekoratoren-auth"}[3m]))) > 10
          for: 3m
          annotations:
            summary: More than a tenth of nav-dekoratoren-auth's log lines are warnings or errors
            action: Read the logs. "PDL request failed" and "Token request for PDL failed" are users without a name, "Token introspection failed" is Texas.
          labels:
            namespace: navno
            severity: warning
            receiver_reference: team-navno-backend-alerts
            alert_type: custom

        # The app can't tell who a request is from, and answers 500 rather than "nobody is logged in"
        - alert: NavDekoratorenAuthCannotValidateTokens
          expr: |
            100 * sum(rate(nav_dekoratoren_auth_requests_total{outcome="error"}[3m]))
              / sum(rate(nav_dekoratoren_auth_requests_total[3m])) > 1
          for: 3m
          annotations:
            summary: nav-dekoratoren-auth answers more than 1 % of its requests with an error
            consequence: Dekoratøren shows the users behind those requests as logged out.
            action: The log line "Token introspection failed" has what Texas answered. nav_dekoratoren_auth_upstream_requests_total with upstream texas_introspect says whether Texas, in the pod, answers at all.
          labels:
            namespace: navno
            severity: danger
            receiver_reference: team-navno-backend-alerts
            alert_type: custom

        # PDL is down, slow, or out of our reach
        - alert: NavDekoratorenAuthNamesFailing
          expr: |
            100 * sum(rate(nav_dekoratoren_auth_names_total{source="failed"}[5m]))
              / sum(rate(nav_dekoratoren_auth_names_total{source=~"found|missing|failed"}[5m])) > 50
          for: 10m
          annotations:
            summary: More than half of nav-dekoratoren-auth's lookups in PDL fail
            consequence: Logged-in users are logged in, but dekoratøren shows them without their name. A name the pod already has is still shown, for up to half an hour.
            action: nav_dekoratoren_auth_upstream_requests_total says whether it is pdl or texas_token, and how each answers. The log lines "PDL request failed" and "Token request for PDL failed" have the status and PDL's error codes.
          labels:
            namespace: navno
            severity: warning
            receiver_reference: team-navno-backend-alerts
            alert_type: custom

        # PDL refuses what we send: the token, the access, or the query. Those are ours to fix.
        # PDL being down is a server_error, a 5xx or a timeout, and isn't counted here.
        - alert: NavDekoratorenAuthPdlRejectingRequests
          expr: |
            sum(increase(nav_dekoratoren_auth_pdl_errors_total{code!~"server_error|not_found"}[15m])) > 5
            or
            sum(increase(nav_dekoratoren_auth_upstream_requests_total{upstream="pdl",status="4xx"}[15m])) > 5
          for: 5m
          annotations:
            summary: PDL is refusing nav-dekoratoren-auth's requests
            consequence: Logged-in users are shown without their name.
            action: nav_dekoratoren_auth_pdl_errors_total says which code. unauthenticated and unauthorized are the token or the access to pdl-api (PDL_TOKEN_TARGET, and pdl-api's own access policy, which has to name this app), bad_request is our query.
          labels:
            namespace: navno
            severity: warning
            receiver_reference: team-navno-backend-alerts
            alert_type: custom
